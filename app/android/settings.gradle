// pnpm monorepo：@react-native/gradle-plugin 被 hoist 到 workspace root 的 .pnpm 结构，
// app 本地 node_modules 没有它，硬编码 ../node_modules 会失败。用 node require.resolve
// 动态解析真实路径（RN 0.75 官方 monorepo 推荐写法）。
// 注意：pluginManagement{} 必须是脚本第一个语句，故路径解析写在块内。
pluginManagement {
  def gradlePluginPath = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('@react-native/gradle-plugin/package.json')")
    }.standardOutput.asText.get().trim()
  ).getParentFile().absolutePath
  includeBuild(gradlePluginPath)
}
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  def rnCliBin = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('@react-native-community/cli/package.json')")
    }.standardOutput.asText.get().trim()
  ).getParentFile().absolutePath + "/build/bin.js"
  ex.autolinkLibrariesFromCommand(["node", rnCliBin, "config"])
}
rootProject.name = 'KidsMobile'
include ':app'

def gradlePluginPath = new File(
  providers.exec {
    workingDir(rootDir)
    commandLine("node", "--print", "require.resolve('@react-native/gradle-plugin/package.json')")
  }.standardOutput.asText.get().trim()
).getParentFile().absolutePath
includeBuild(gradlePluginPath)
