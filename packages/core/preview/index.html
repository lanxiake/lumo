<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pet-core 浏览器预览</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font: 14px/1.5 system-ui, "Segoe UI", sans-serif;
        background: #0f1115;
        color: #e6e6e6;
        display: grid;
        grid-template-columns: 1fr 320px;
        height: 100vh;
      }
      #pet {
        border: none;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 50% 40%, #1c2230, #0f1115 70%);
      }
      aside {
        border-left: 1px solid #262b36;
        padding: 16px;
        overflow-y: auto;
        background: #12151b;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 4px;
      }
      .sub {
        color: #7b8391;
        font-size: 12px;
        margin: 0 0 16px;
      }
      .state {
        font-size: 20px;
        font-weight: 600;
        color: #7ee0a8;
        padding: 8px 12px;
        background: #0c1a12;
        border-radius: 8px;
        margin-bottom: 4px;
      }
      .emo {
        color: #9fb0c3;
        font-size: 12px;
        margin-bottom: 16px;
      }
      .group {
        margin-bottom: 16px;
      }
      .group h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #6b7280;
        margin: 0 0 8px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      button {
        background: #1e2530;
        color: #d7dde6;
        border: 1px solid #2b333f;
        border-radius: 6px;
        padding: 6px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      button:hover {
        background: #28313d;
      }
      button.primary {
        background: #234a34;
        border-color: #2f6344;
        color: #b6f0cc;
      }
      select {
        width: 100%;
        background: #1e2530;
        color: #d7dde6;
        border: 1px solid #2b333f;
        border-radius: 6px;
        padding: 6px;
      }
      #log {
        font-family: ui-monospace, monospace;
        font-size: 11px;
        color: #8b95a3;
        white-space: pre-wrap;
        max-height: 160px;
        overflow-y: auto;
        background: #0b0d11;
        border-radius: 6px;
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <iframe id="pet" src="./webview.html"></iframe>
    <aside>
      <h1>pet-core 浏览器预览</h1>
      <p class="sub">假事件 → 状态机 → 表情/口型/动作，无 RN/真机</p>

      <div class="group">
        <h2>模型</h2>
        <select id="modelSel">
          <option value="mao_pro">mao_pro（猫猫，表情+动作丰富）</option>
          <option value="ug_official">ug_official（UG，表情/道具）</option>
        </select>
      </div>

      <div class="group">
        <h2>当前状态</h2>
        <div class="state" id="stateBox">idle</div>
        <div class="emo" id="emoBox">emotion: neutral</div>
      </div>

      <div class="group">
        <h2>文本对话链路</h2>
        <div class="row">
          <button class="primary" data-ev="USER_SEND">USER_SEND</button>
          <button data-ev="AGENT_DELTA">AGENT_DELTA</button>
          <button data-ev="AGENT_FINAL">AGENT_FINAL</button>
          <button data-ev="TTS_READY">TTS_READY</button>
          <button data-ev="AUDIO_END">AUDIO_END</button>
        </div>
      </div>

      <div class="group">
        <h2>语音链路</h2>
        <div class="row">
          <button data-ev="MIC_START">MIC_START</button>
          <button data-ev="RECOGNIZING">RECOGNIZING</button>
          <button data-ev="RECOGNIZED">RECOGNIZED</button>
          <button data-ev="MIC_STOP">MIC_STOP</button>
          <button data-ev="MIC_CANCEL">MIC_CANCEL</button>
        </div>
      </div>

      <div class="group">
        <h2>安全 / 异常</h2>
        <div class="row">
          <button data-ev="SAFETY_BLOCKED">SAFETY_BLOCKED</button>
          <button data-ev="NETWORK_ERROR">NETWORK_ERROR</button>
          <button data-ev="OFFLINE">OFFLINE</button>
          <button data-ev="ONLINE">ONLINE</button>
          <button data-ev="ACK">ACK</button>
          <button data-ev="RETRY">RETRY</button>
          <button data-ev="RESET">RESET</button>
        </div>
      </div>

      <div class="group">
        <h2>口型（说话演示）</h2>
        <div class="row">
          <button class="primary" id="lipStart">开始假口型</button>
          <button id="lipStop">停止口型</button>
        </div>
      </div>

      <div class="group">
        <h2>事件日志</h2>
        <div id="log"></div>
      </div>
    </aside>
    <script type="module" src="./harness.ts"></script>
  </body>
</html>
